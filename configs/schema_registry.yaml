schema_version: 1
entities:
  academic_records:
    columns:
      student_id:
        type: string
        verification_status: scenario_constant
        description: Synthetic sequential identifier.
      gpa:
        type: decimal(3,2)
        verification_status: experiment_assumption
        distribution:
          family: clipped_normal
          mean: 2.8
          std: 0.6
          min: 0.0
          max: 4.0
        verification_statuses:
          family: experiment_assumption
          mean: experiment_assumption
          std: experiment_assumption
          min: scenario_constant
          max: scenario_constant
      enrollment_status:
        type: enum
        verification_status: source_verified
        allowed_values: [full_time, part_time]
        distribution:
          family: categorical
          probabilities:
            full_time: 0.62
            part_time: 0.38
        verification_statuses:
          family: source_verified
          probabilities: source_verified
      semester:
        type: string
        verification_status: scenario_constant
        fixed_value: Fall 2024
        term_anchor_date: "2024-09-01"
        verification_statuses:
          fixed_value: scenario_constant
          term_anchor_date: scenario_constant
  financial_aid_records:
    columns:
      student_id:
        type: string
        verification_status: scenario_constant
      aid_amount:
        type: decimal(10,2)
        verification_status: derived_from_sources
        distribution:
          family: zero_inflated_positive
          zero_probability: 0.28
          positive_family: gamma
          recipient_mean: 14100.0
          gamma_shape: 2.0
        verification_statuses:
          family: derived_from_sources
          zero_probability: derived_from_sources
          positive_family: experiment_assumption
          recipient_mean: source_verified
          gamma_shape: experiment_assumption
      aid_status:
        type: enum
        verification_status: experiment_assumption
        allowed_values: [active, suspended, none]
        distribution:
          family: categorical_by_aid_amount
          zero_value: none
          positive_probabilities:
            active: 0.95
            suspended: 0.05
        verification_statuses:
          family: experiment_assumption
          zero_value: derived_from_sources
          positive_probabilities: experiment_assumption
      disbursement_date:
        type: date
        verification_status: experiment_assumption
        distribution:
          family: within_term_window
          term_anchor_date: "2024-09-01"
          offset_days_min: -10
          offset_days_max: 30
        verification_statuses:
          family: source_verified
          term_anchor_date: scenario_constant
          offset_days_min: experiment_assumption
          offset_days_max: experiment_assumption
