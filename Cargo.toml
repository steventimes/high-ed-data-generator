[package]
name = "high-ed-data-generator"
version = "0.1.0"
edition = "2021"

[lib]
path = "rust/src/lib.rs"

[[bin]]
name = "high-ed-data-generator"
path = "rust/src/main.rs"

[dependencies]
anyhow = "1.0.103"
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
rand = "0.8.7"
rand_chacha = "0.3"
rand_distr = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_bw = "2.5.6"
sha2 = "0.10"
tempfile = "3.10"
thiserror = "1.0"

[dev-dependencies]
hex = "0.4"
